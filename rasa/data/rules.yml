version: "3.1"

rules:
  - rule: Greet the user
    steps:
      - intent: greeting
      - action: utter_greeting

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Fallback to default
    steps:
      - intent: nlu_fallback
      - action: utter_default
