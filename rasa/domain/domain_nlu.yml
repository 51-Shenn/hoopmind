version: "3.1"

intents:
  - greeting
  - goodbye
  - player_info
  - player_stats
  - team_info
  - team_stats
  - compare
  - all_star
  - draft_info
  - league_info
  - dataset_scope

entities:
  - player
  - team
  - season
  - stat
  - position
  - award
  - league

slots:
  return_value:
    type: any
    mappings:
      - type: controlled
  player:
    type: text
    mappings:
      - type: custom
  player2:
    type: text
    mappings:
      - type: custom
  team:
    type: text
    mappings:
      - type: custom
  season:
    type: text
    mappings:
      - type: custom

responses:
  utter_greeting:
    - text: "Hello! I'm HoopMind, your NBA knowledge chatbot. How can I help you?"
  utter_goodbye:
    - text: "Goodbye! Enjoy the game!"
  utter_default:
    - text: "I'm not sure I understand. Could you rephrase that?"
  utter_ask_player:
    - text: "Which player are you interested in?"
  utter_ask_team:
    - text: "Which team are you interested in?"
  utter_ask_season:
    - text: "Which season?"
  utter_player_info:
    - text: "Let me look up information about {player}."
  utter_player_stats:
    - text: "Let me get {player}'s statistics for you."
  utter_team_info:
    - text: "Let me look up information about the {team}."
  utter_team_stats:
    - text: "Let me get the {team}'s statistics for you."
  utter_ask_player2:
    - text: "And who would you like to compare them with?"
  utter_compare_players:
    - text: "Let me compare {player} and {player2} for you."
  utter_compare_teams:
    - text: "Let me compare those teams for you."
  utter_league_info:
    - text: "Here is information about the NBA league."
  utter_dataset_scope:
    - text: "Our database contains NBA, ABA, and BAA records from 1947 to 2027, with data on 5000+ players and 90+ teams."
