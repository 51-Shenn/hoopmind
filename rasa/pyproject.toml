[project]
name = "hoopmind-rasa"
version = "0.1.0"
description = "HoopMind generative basketball chatbot using Rasa and Gemini"
requires-python = ">=3.11,<3.12"

dependencies = [
    "rasa-pro==3.18.1",
    "rasa-sdk==3.18.0",
    "setuptools==80.10.2",
    "keras>=3.12.1,<3.13.0",
    "tf-keras>=2.15.0,<3.0.0",
    "tensorflow>=2.19.0,<2.20.0",
    "tensorflow-hub>=0.16.0,<0.17.0",
    "tensorflow-io-gcs-filesystem==0.31; sys_platform == 'win32'",
    "safetensors>=0.8.0,<0.9.0",
    "sklearn-crfsuite>=0.5.0,<0.6.0",
    "skops>=0.14.0,<0.15.0",
    "regex>=2026.6.28,<2026.7.0",
    "jieba>=0.42.1,<0.43",
    "spacy>=3.5.4,<4.0.0",
]

[tool.uv]
package = false
